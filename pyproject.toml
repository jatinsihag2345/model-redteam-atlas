[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-redteam-atlas"
version = "0.1.0"
description = "Adversarial prompt evaluation, jailbreak defense testing, and red-teaming harness for frontier language models."
authors = [{ name = "Jatin Sihag", email = "clyfergamer@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
redteam-scan = "redteam_atlas.cli:main"
